<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>运营后台 · 联赞 Lianvo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css"/>
<style>
  .appbar{position:sticky;top:0;z-index:50;height:var(--nav-h);background:var(--glass-bg-strong);backdrop-filter:blur(14px);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .appbar .brand{font-weight:800;display:flex;align-items:center;gap:9px}
  .appbar .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
  .usermenu{display:flex;align-items:center;gap:10px}
  .usermenu .avatar{width:38px;height:38px;font-size:.9rem}
  .main{padding:26px}
  .page-head{margin-bottom:20px}
  .page-head h2{margin-bottom:4px}
  .kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--color-border);font-size:.9rem}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--color-muted-foreground)}
  .kv .v{font-weight:700}
  .empty{padding:40px;text-align:center;color:var(--color-muted-foreground)}
  .check-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--radius);background:var(--glass-bg);border:1px solid var(--glass-border);margin-bottom:10px}
  .switch{position:relative;width:48px;height:26px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--color-border);border-radius:999px;transition:.2s;cursor:pointer}
  .slider:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:var(--shadow-sm)}
  .switch input:checked + .slider{background:var(--color-primary)}
  .switch input:checked + .slider:before{transform:translateX(22px)}
  .gate-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .gate-ic svg{width:22px;height:22px}
</style>
</head>
<body>

<div class="appbar">
  <a class="brand" href="landing.html"><span class="logo">蜂</span> 联赞</a>
  <div class="usermenu">
    <span class="badge badge-primary" id="roleBadge">运营</span>
    <div class="avatar" id="ua">?</div>
    <div style="line-height:1.1"><div style="font-weight:700" id="uname">…</div><div class="tiny muted" id="uid2">…</div></div>
    <a class="btn btn-ghost btn-sm" href="app.html">工作台</a>
    <button class="btn btn-ghost btn-sm" onclick="logout()">退出</button>
  </div>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>

<div id="toast"></div>

<script>
const API="/api/v1";
let TOKEN=localStorage.getItem("hg_token")||"";
let ME=null;
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function money(c){return "¥"+(Math.round((c||0)/100)).toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function statusPill(s){return `<span class="status ${esc(s)}">${esc(s)}</span>`;}
async function api(path,opts={}){
  try{
    const r=await fetch(API+path,{method:opts.method||"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},
      body:opts.body?JSON.stringify(opts.body):undefined});
    let j=null;try{j=await r.json()}catch(e){}
    return {r,j};
  }catch(e){return {r:{ok:false,status:0},j:{msg:String(e)}};}
}
function logout(){localStorage.removeItem("hg_token");localStorage.removeItem("hg_uid");localStorage.removeItem("hg_role");location.href="landing.html";}

const NAV=[
  {id:"dash",label:"运营看板",ic:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>'},
  {id:"ready",label:"上线就绪",ic:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>'},
  {id:"gates",label:"合规闸门",ic:'<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'},
  {id:"wd",label:"提现审批",ic:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M16 12h.01"/>'},
  {id:"tasks",label:"任务监管",ic:'<path d="M3 3h18v4H3zM3 10h18v11H3z"/>'},
  {id:"orders",label:"订单监管",ic:'<path d="M3 3h2l2 13h11l2-9H6"/>'},
  {id:"disputes",label:"纠纷仲裁",ic:'<path d="M12 2v20M7 6h10M7 6l-3 7h6zM17 6l3 7h-6zM7 21h10"/>'}
];
const ROLE_LABEL={requester:"需求方",provider:"接单方",admin:"运营"};
let VIEW="dash";

function renderShell(){
  $("#sidebar").innerHTML=`<div class="side-label">运营工作台</div>`+
    NAV.map(n=>`<a class="side-link ${n.id===VIEW?'on':''}" data-id="${n.id}" href="#${n.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${n.ic}</svg>${n.label}</a>`).join("");
  $$("#sidebar .side-link").forEach(a=>a.onclick=()=>{VIEW=a.dataset.id;location.hash=VIEW;renderShell();route();});
}
function route(){
  const v=location.hash.replace("#","")||"dash";VIEW=v;renderShell();
  const fns={dash:dashView,ready:readyView,gates:gatesView,wd:wdView,tasks:tasksView,orders:ordersView,disputes:disputesView};
  (fns[v]||dashView)();
}

// ---- dashboard ----
async function dashView(){
  const {r,j}=await api("/admin/metrics");
  const m=(r.ok&&j.data)?j.data:{};
  const obs=m.orders_by_status||m.OrdersByStatus||{};
  const dist=Object.entries(obs).map(([k,v])=>`<div style="margin-bottom:8px"><div class="flex justify-between tiny"><span>${esc(k)}</span><b>${v}</b></div><div class="progressbar"><i style="width:${obs?Math.min(100,(v/Math.max(1,m.orders_total))*100):0}%"></i></div></div>`).join("");
  $("#main").innerHTML=`<div class="page-head"><h2>运营看板</h2><p class="muted">平台实时指标快照（只读聚合）。</p></div>
  <div class="grid grid-4">
    <div class="glass card stat"><div class="k">用户总数</div><div class="v">${m.users_total||0}</div><div class="d">接单方 ${m.providers||0} · 需求方 ${m.requesters||0}</div></div>
    <div class="glass card stat"><div class="k">任务总数</div><div class="v">${m.tasks_total||0}</div><div class="d">开放中 ${m.tasks_open||0}</div></div>
    <div class="glass card stat"><div class="k">订单总数</div><div class="v">${m.orders_total||0}</div><div class="d">已结算 ${m.orders_settled||0}</div></div>
    <div class="glass card stat"><div class="k">平台交易额(GMV)</div><div class="v">${money(m.gmv_cents||0)}</div><div class="d">已结算合计</div></div>
    <div class="glass card stat"><div class="k">平台资金水位</div><div class="v">${money(m.platform_balance_cents||0)}</div><div class="d">可用+冻结</div></div>
    <div class="glass card stat"><div class="k">提现申请</div><div class="v">${m.withdrawals_total||0}</div><div class="d">待处理 ${m.withdrawals_pending||0}</div></div>
    <div class="glass card stat"><div class="k">合规红灯</div><div class="v">${m.compliance_red_lights||0}</div><div class="d">未落地卡点</div></div>
    <div class="glass card stat"><div class="k">运营账号</div><div class="v">${m.admins||0}</div><div class="d">管理员</div></div>
  </div>
  <div class="grid grid-2" style="margin-top:20px">
    <div class="glass card"><h3 style="margin-bottom:16px">订单状态分布</h3>${dist||'<div class="empty">暂无订单</div>'}</div>
    <div class="glass card" style="background:linear-gradient(135deg,rgba(37,99,235,.08),rgba(234,88,12,.06))"><h3 style="margin-bottom:12px">平台概览</h3>
      <div class="kv"><span class="k">撮合模式</span><span class="v">AI 五因子评分</span></div>
      <div class="kv"><span class="k">资金合规</span><span class="v">托管 + 行级隔离</span></div>
      <div class="kv"><span class="k">平台佣金</span><span class="v">10%（低佣金）</span></div>
      <div class="kv"><span class="k">合规红灯</span><span class="v">${m.compliance_red_lights||0} 项未落地</span></div>
    </div>
  </div>`;
}

// ---- readiness ----
async function readyView(){
  const {r,j}=await api("/readiness");
  const d=(r.ok&&j.data)?j.data:{};
  const gate=d.compliance_gate||{};
  const pay=d.payment||{},kyc=d.kyc||{},emb=d.embedding||{};
  const row=(label,on,detail)=>`<div class="check-row"><div><b>${esc(label)}</b><div class="tiny muted">${esc(detail||"")}</div></div>${on?'<span class="badge badge-success">就绪</span>':'<span class="badge badge-warning">未就绪</span>'}</div>`;
  $("#main").innerHTML=`<div class="page-head"><h2>上线就绪检查</h2><p class="muted">生产就绪 = 真实资金通道 + 真实 KYC + 合规四门全开 + ICP 备案。</p></div>
  <div class="grid grid-2">
    <div class="glass card">
      <h3 style="margin-bottom:14px">通道与存储</h3>
      ${row("存储模式",d.storage_mode==="mysql",d.storage_mode==="mysql"?"已接入 MySQL 8.0":"内存模式（演示）")}
      ${row("语义嵌入",emb.mode==="real",emb.mode==="real"?"已接入真实 Embedding":"本地回退（回退）")}
      ${row("支付通道",pay.live,"模式："+(pay.mode||"-")+(pay.missing&&pay.missing.length?" · 缺 "+pay.missing.join(","):""))}
      ${row("KYC 通道",kyc.live,"模式："+(kyc.mode||"-")+(kyc.missing&&kyc.missing.length?" · 缺 "+kyc.missing.join(","):""))}
      ${row("ICP 备案",!!d.icp_filed,d.icp_filed?"已备案":"未备案")}
    </div>
    <div class="glass card">
      <h3 style="margin-bottom:14px">合规四门</h3>
      ${row("KYC 实名",!!gate.kyc)}
      ${row("税源地签约",!!gate.tax_source)}
      ${row("支付托管开通",!!gate.escrow)}
      ${row("ICP 备案",!!gate.icp)}
      <div class="check-row" style="margin-top:14px;background:${d.go_live_ready?'rgba(22,163,74,.1)':'rgba(217,119,6,.1)'}">
        <div><b>生产就绪态</b><div class="tiny muted">${d.go_live_ready?"满足全部条件，可上线":"仍有未满足条件，禁止交易放行"}</div></div>
        ${d.go_live_ready?'<span class="badge badge-success">GO LIVE</span>':'<span class="badge badge-warning">NOT READY</span>'}
      </div>
    </div>
  </div>`;
}

// ---- compliance gates ----
async function gatesView(){
  const {r,j}=await api("/compliance");
  const st=(r.ok&&j.data)?j.data:{};
  const items=(st.items)||{};
  const defs=[["kyc","KYC 实名认证","用户实名（用户级），登录即视为已实名，生产接真实 KYC"],
    ["tax_source","税源地签约","卡1：平台与税源地签约，二清合规前提"],
    ["escrow","支付托管开通","卡2：资金托管通道开通，交易资金托管"],
    ["icp","ICP 备案","卡3：经营性网站 ICP 备案"]];
  $("#main").innerHTML=`<div class="page-head"><h2>合规闸门</h2><p class="muted">四门齐开才放行交易；关闭任意一扇即冻结对应交易动作。</p></div>
  <div class="grid grid-2">
    ${defs.map(d=>{const on=!!items[d[0]];return `<div class="glass card">
      <div class="flex items-center gap-12" style="margin-bottom:12px">
        <div class="gate-ic" style="background:${on?'rgba(22,163,74,.12)':'rgba(217,119,6,.14)'};color:${on?'var(--color-success)':'var(--color-warning)'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
        <div><h3>${esc(d[1])}</h3><div class="tiny muted">${esc(d[2])}</div></div>
      </div>
      <label class="switch"><input type="checkbox" data-item="${d[0]}" ${on?'checked':''}><span class="slider"></span></label>
      <span class="tiny" style="margin-left:10px;color:${on?'var(--color-success)':'var(--color-warning)'}">${on?'已开启':'已关闭'}</span>
    </div>`;}).join("")}
  </div>`;
  $$('#main input[type=checkbox]').forEach(cb=>cb.onchange=async()=>{
    const {r,j}=await api("/compliance",{method:"POST",body:{item:cb.dataset.item,on:cb.checked}});
    toast((r.ok&&j.msg)||(j&&j.msg)||"更新失败");if(r.ok)gatesView();
  });
}

// ---- withdrawals ----
async function wdView(){
  const {r,j}=await api("/wallet/withdrawals");
  const list=(r.ok&&j.data)?j.data:[];
  const pend=list.filter(w=>w.status==="pending");
  $("#main").innerHTML=`<div class="page-head"><h2>提现审批</h2><p class="muted">${pend.length} 笔待审批 · 共 ${list.length} 笔</p></div>
  <div class="grid gap-12">${list.length?list.map(w=>`<div class="glass card">
    <div class="flex items-center justify-between" style="margin-bottom:10px">
      <div><b>${esc(w.uid)}</b> · ${money(w.amount_cents||0)}</div>${statusPill(w.status)}
    </div>
    <div class="kv"><span class="k">提现单 ID</span><span class="v mono tiny">${esc(w.id)}</span></div>
    <div class="kv"><span class="k">申请时间</span><span class="v">${new Date((w.created_at||0)*1000).toLocaleString()}</span></div>
    ${w.note?`<div class="kv"><span class="k">备注</span><span class="v">${esc(w.note)}</span></div>`:""}
    ${w.status==="pending"?`<div class="flex gap-12" style="margin-top:14px">
      <button class="btn btn-primary btn-sm" onclick="approveWd('${esc(w.id)}',true)">通过并出账</button>
      <button class="btn btn-danger btn-sm" onclick="approveWd('${esc(w.id)}',false)">驳回（解冻）</button></div>`:""}
  </div>`).join(""):`<div class="empty glass card">暂无提现申请</div>`}</div>`;
}
async function approveWd(id,ok){
  const {r,j}=await api("/wallet/withdrawals/"+encodeURIComponent(id)+"/approve",{method:"POST",body:{approve:ok,note:ok?"运营审批通过":"运营驳回"}});
  toast((r.ok&&j.msg)||(j&&j.msg)||"操作失败");if(r.ok)wdView();
}

// ---- task supervision ----
async function tasksView(){
  const {r,j}=await api("/tasks");
  const list=(r.ok&&j.data)?j.data:[];
  $("#main").innerHTML=`<div class="page-head"><h2>任务监管</h2><p class="muted">全平台 ${list.length} 个任务（含草稿/开放/已接）。</p></div>
  <div class="grid gap-12">${list.length?list.map(t=>`<div class="item" style="cursor:pointer" onclick="location.href='task.html?task=${esc(t.id)}'">
    <div class="av">${esc((t.id||"?").slice(0,2))}</div>
    <div class="grow"><div class="ttl">${esc(t.title)}</div><div class="sub">${esc(t.category||"")} · ${money(t.budget_cents||0)} · 需求方 ${esc(t.requester_id||"")}</div></div>
    ${statusPill(t.status||"open")}</div>`).join(""):`<div class="empty glass card">暂无任务</div>`}</div>`;
}

// ---- order supervision ----
async function ordersView(){
  const {r,j}=await api("/orders");
  const list=(r.ok&&j.data)?j.data:[];
  $("#main").innerHTML=`<div class="page-head"><h2>订单监管</h2><p class="muted">全平台 ${list.length} 笔订单。</p></div>
  <div class="grid gap-12">${list.length?list.map(o=>`<div class="item" style="cursor:pointer" onclick="location.href='task.html?order=${esc(o.id)}'">
    <div class="av">${esc((o.task_id||"?").slice(0,2))}</div>
    <div class="grow"><div class="ttl">${esc(o.task_id)}</div><div class="sub">需求方 ${esc(o.requester_id||"")} · 接单方 ${esc(o.provider_id||"")} · ${money(o.amount_cents||0)}</div></div>
    ${statusPill(o.status)}</div>`).join(""):`<div class="empty glass card">暂无订单</div>`}</div>`;
}

// ---- disputes / 仲裁 ----
function acceptanceSummary(o){
  if(o.severe_mismatch) return `<span style="color:var(--c-danger,#DC2626);font-weight:700">需求方判定：严重不符</span>`;
  const acc=o.acceptance||[];
  if(!acc.length) return "验收逐项记录为空";
  const fail=acc.filter(a=>!a.pass).length;
  return `验收 ${acc.length} 项 · 未达标 ${fail} 项`;
}
async function disputesView(){
  const {r,j}=await api("/orders");
  const list=(r.ok&&j.data)?j.data:[];
  const disputed=list.filter(o=>o.status==="disputed");
  const resolved=list.filter(o=>o.resolved_at);
  let html=`<div class="page-head"><h2>纠纷仲裁</h2><p class="muted">待仲裁 ${disputed.length} 笔 · 已结案 ${resolved.length} 笔。</p></div>`;
  // 待仲裁
  html+=`<div class="section-title">⚠️ 待仲裁（${disputed.length}）</div>`;
  html+= disputed.length? `<div class="grid gap-12">`+disputed.map(o=>{
    return `<div class="glass card card-lg">
      <div class="flex justify-between"><b>${esc(o.id)}</b>${statusPill(o.status)}</div>
      <div class="kv"><span class="k">任务</span><span class="v mono">${esc(o.task_id)}</span></div>
      <div class="kv"><span class="k">金额</span><span class="v">${money(o.amount_cents||0)}</span></div>
      <div class="kv"><span class="k">需求方 / 接单方</span><span class="v">${esc(o.requester_id)} / ${esc(o.provider_id)}</span></div>
      <div class="kv"><span class="k">纠纷事由</span><span class="v" style="text-align:left;font-weight:600">${esc(o.dispute_reason||"-")}</span></div>
      <div class="kv"><span class="k">验收比对</span><span class="v" style="text-align:left">${acceptanceSummary(o)}</span></div>
      <div class="field" style="margin-top:10px"><label class="label">退款比例（需求方 %，0-100）</label><input class="input" id="rf_${esc(o.id)}" type="number" min="0" max="100" value="50"></div>
      <div class="field"><label class="label">裁决说明</label><textarea class="textarea" id="rd_${esc(o.id)}" placeholder="说明裁决依据…"></textarea></div>
      <button class="btn btn-primary" onclick="resolveDispute('${esc(o.id)}')">仲裁结案</button>
      <a class="btn btn-ghost" href="task.html?order=${esc(o.id)}">查看详情</a>
    </div>`;
  }).join("")+`</div>` : `<div class="empty glass card">无待仲裁纠纷 🎉</div>`;
  // 已结案
  if(resolved.length){
    html+=`<div class="section-title">✅ 已结案（${resolved.length}）</div><div class="grid gap-12">`+resolved.map(o=>{
      return `<div class="glass card card-lg">
        <div class="flex justify-between"><b>${esc(o.id)}</b>${statusPill(o.status)}</div>
        <div class="kv"><span class="k">纠纷事由</span><span class="v" style="text-align:left;font-weight:600">${esc(o.dispute_reason||"-")}</span></div>
        <div class="kv"><span class="k">退款比例</span><span class="v">${o.refund_pct||0}%（${money(o.refund_cents||0)}）</span></div>
        <div class="kv"><span class="k">裁决说明</span><span class="v" style="text-align:left;font-weight:600">${esc(o.resolved_note||"-")}</span></div>
      </div>`;
    }).join("")+`</div>`;
  }
  $("#main").innerHTML=html;
}
async function resolveDispute(id){
  const pct=parseInt($("#rf_"+id).value||"50",10);
  const decision=$("#rd_"+id).value.trim()||"运营仲裁结案";
  const {r,j}=await api("/orders/"+encodeURIComponent(id)+"/resolve",{method:"POST",body:{refund_pct:pct,decision}});
  toast((r.ok&&j.msg)||(j&&j.msg)||"结案失败");if(r.ok)location.reload();
}

// ---- boot ----
(async function(){
  if(!TOKEN){location.href="auth.html";return;}
  const {r,j}=await api("/auth/me");
  if(!r.ok||!j.data){localStorage.removeItem("hg_token");location.href="auth.html";return;}
  ME=j.data;ME.uid=ME.uid||localStorage.getItem("hg_uid");ME.role=ME.role||localStorage.getItem("hg_role")||"requester";
  if(ME.role!=="admin"){location.href="app.html";return;}
  $("#uname").textContent=ME.name||ME.uid;$("#uid2").textContent=ME.uid;
  $("#ua").textContent=(ME.uid||"?").slice(0,2);
  renderShell();window.addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
