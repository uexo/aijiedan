<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蜂单 HiveGet · 运营看板 & 企业版</title>
<style>
  :root{
    --bg:#0f1220; --card:#181c2e; --card2:#1f2440; --line:#2b3155;
    --txt:#e8ecff; --muted:#9aa3c7; --accent:#5b8cff; --good:#37d39b; --warn:#ffb454; --bad:#ff6b81;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2240 0%,var(--bg) 60%);color:var(--txt);min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 18px;
    background:rgba(15,18,32,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{font-size:18px;font-weight:800;letter-spacing:.5px}
  .brand small{font-size:11px;color:var(--muted);font-weight:500;margin-left:6px}
  .spacer{flex:1}
  .nav{display:flex;gap:6px}
  .nav a{padding:7px 14px;border-radius:10px;font-size:13px;color:var(--muted);border:1px solid transparent}
  .nav a.on{color:var(--txt);background:var(--card2);border-color:var(--line)}
  .login{display:flex;align-items:center;gap:8px}
  select,input,button,textarea{font-family:inherit}
  .login select,.login input{background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:8px 10px;border-radius:10px;font-size:13px;outline:none}
  .login button{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer}
  .me{display:flex;align-items:center;gap:10px;font-size:13px}
  .rolebadge{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card2)}
  .rolebadge.requester{color:var(--good);border-color:var(--good)}
  .rolebadge.provider{color:var(--accent);border-color:var(--accent)}
  .rolebadge.admin{color:var(--warn);border-color:var(--warn)}
  .me a{font-size:12px;color:var(--muted)}
  .wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
  .section-title{font-size:15px;font-weight:700;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
  .section-title .tag{font-size:11px;font-weight:600;color:var(--accent);background:rgba(91,140,255,.12);
    border:1px solid var(--accent);padding:2px 10px;border-radius:999px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .stat .lab{font-size:12px;color:var(--muted);margin-bottom:8px}
  .stat .val{font-size:26px;font-weight:800}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .stat.good .val{color:var(--good)} .stat.warn .val{color:var(--warn)} .stat.bad .val{color:var(--bad)}
  .stat.accent .val{color:var(--accent)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .panel h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
  .kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:14px;margin:6px 0}
  .kv b{color:var(--muted);font-weight:500}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.good{background:var(--good)} .btn.warn{background:var(--warn)} .btn:disabled{opacity:.5;cursor:not-allowed}
  .inp{background:var(--card2);border:1px solid var(--line);color:var(--txt);padding:9px 11px;border-radius:10px;font-size:13px;outline:none}
  .inp:focus{border-color:var(--accent)} textarea.inp{width:100%;min-height:64px;resize:vertical}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tabs a{padding:9px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs a.on{color:var(--txt);border-bottom-color:var(--accent)}
  .card{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--accent)}
  .card h3{margin:0 0 6px;font-size:15px}
  .card .meta{color:var(--muted);font-size:12px;margin-top:6px}
  .chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}
  .item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .grow{flex:1;min-width:0}
  .av{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent),#8a5bff);
    display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:0 0 auto;font-size:14px}
  .bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden;margin:4px 0}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8a5bff)}
  .status{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
  .status.pending{color:var(--warn);border-color:var(--warn)}
  .status.approved,.status.active{color:var(--good);border-color:var(--good)}
  .status.rejected{color:var(--bad);border-color:var(--bad)}
  .status.disputed{color:var(--bad);border-color:var(--bad)}
  .err{background:rgba(255,107,129,.1);border:1px solid var(--bad);color:#ffd0d6;padding:12px;border-radius:12px;font-size:13px;margin:8px 0}
  .hint{color:var(--muted);font-size:13px;line-height:1.7}
  .ok{background:rgba(55,211,155,.1);border:1px solid var(--good);color:#c9ffe9;padding:12px;border-radius:12px;font-size:13px;margin:8px 0}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--card2);
    border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:13px;z-index:50;max-width:90vw;
    box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
  .gmtop{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .gmseg{height:10px;border-radius:4px;background:var(--accent)}
  footer{margin-top:34px;color:var(--muted);font-size:12px;text-align:center;line-height:1.8}
  @media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.nav{display:none}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">蜂单 <small>运营 · 企业版</small></div>
  <div class="nav" id="nav"></div>
  <div class="spacer"></div>
  <div id="authbox" class="login"></div>
</div>

<div class="wrap" id="app"></div>

<footer>
  演示账号：R001=需求方 · P001~P004=接单方 · <b>A001=运营</b> &nbsp;|&nbsp;
  <a href="/static/">需求大厅</a> &nbsp;|&nbsp;
  <a href="/console" target="_blank">旧版控制台 /console</a>
</footer>

<script>
const API = location.origin;
const DEMO = [
  {uid:"R001",role:"requester",name:"需求方演示"},
  {uid:"P001",role:"provider",name:"接单方 P001"},
  {uid:"P002",role:"provider",name:"接单方 P002"},
  {uid:"P003",role:"provider",name:"接单方 P003"},
  {uid:"P004",role:"provider",name:"接单方 P004"},
  {uid:"A001",role:"admin",name:"运营 A001"},
];
let TOKEN = localStorage.getItem("hg_token") || "";
let ME = null;
let CATS = [];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function money(c){ return "¥" + ((c||0)/100).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function roleLabel(r){ return {requester:"需求方",provider:"接单方",admin:"运营"}[r]||r; }
function orgRoleLabel(r){ return {owner:"组织主",admin:"管理员",member:"成员",viewer:"只读"}[r]||r; }

async function api(path, opts={}){
  const headers = {"Content-Type":"application/json"};
  if(TOKEN) headers["Authorization"] = "Bearer "+TOKEN;
  const r = await fetch(API+path, {...opts, headers});
  let j=null; try{ j = await r.json(); }catch(e){}
  return {r, j};
}
async function loadMe(){
  if(!TOKEN){ ME=null; return; }
  const {r,j} = await api("/api/v1/auth/me");
  if(r.ok && j && j.data){ ME = {uid:j.data.uid, role:j.data.role, name:j.data.name}; }
  else { TOKEN=""; localStorage.removeItem("hg_token"); ME=null; }
}
function renderAuth(){
  const box = document.getElementById("authbox");
  if(ME){
    box.innerHTML = `<div class="me">
      <span>${esc(ME.name||ME.uid)}</span>
      <span class="rolebadge ${esc(ME.role)}">${roleLabel(ME.role)}</span>
      <a href="#" onclick="logout();return false">退出</a>
    </div>`;
  } else {
    box.innerHTML = `<select id="uid">${DEMO.map(d=>`<option value="${d.uid}">${esc(d.name)}</option>`).join("")}</select>
      <button onclick="login()">登录</button>`;
  }
}
async function login(){
  const uid = document.getElementById("uid").value;
  const {r,j} = await api("/api/v1/auth/login",{method:"POST",body:JSON.stringify({uid})});
  if(r.ok && j && j.data && j.data.token){ TOKEN=j.data.token; localStorage.setItem("hg_token",TOKEN);
    ME={uid:j.data.uid,role:j.data.role,name:j.data.name}; renderAuth(); toast("已登录："+j.data.name); renderNav(); route(); }
  else toast("登录失败：" + (j?j.msg:"网络错误"));
}
function logout(){ TOKEN=""; ME=null; localStorage.removeItem("hg_token"); renderAuth(); toast("已退出"); renderNav(); route(); }

function renderNav(){
  const tabs = [];
  tabs.push(`<a href="#dash" class="${location.hash.startsWith("#dash")?"on":""}">运营看板</a>`);
  tabs.push(`<a href="#orgs" class="${location.hash.startsWith("#org")?"on":""}">组织治理</a>`);
  document.getElementById("nav").innerHTML = tabs.join("");
}
async function loadCats(){
  const {r,j} = await api("/api/v1/meta/categories");
  if(r.ok && j && j.data){
    CATS = j.data.map(c=>typeof c==="string"?{id:c,label:c}:(c.label?c:{id:c.id,label:c.id}));
  }
}
function catOptions(sel){
  return `<select class="inp" id="${sel}"><option value="">— 类目 —</option>${CATS.map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join("")}</select>`;
}

// ---- 路由 ----
function route(){
  const h = location.hash || "#dash";
  if(h.startsWith("#org/")) renderOrg(h.slice(5));
  else if(h.startsWith("#orgs")) renderOrgs();
  else renderDash();
}
window.addEventListener("hashchange", ()=>{ renderNav(); route(); });

// ---- 运营看板 ----
async function renderDash(){
  const app = document.getElementById("app");
  app.innerHTML = `<div class="section-title">平台运营看板 <span class="tag">仅 A001 运营可见</span></div>
    <div id="dashbody"><div class="empty">加载中…</div></div>`;
  if(!ME){ app.innerHTML = `<div class="empty">请先登录（运营账号 <b>A001</b>）以查看平台看板。</div>`; return; }
  if(ME.role !== "admin"){ app.innerHTML = `<div class="err">当前账号 <b>${esc(ME.uid)}</b>（${roleLabel(ME.role)}）无运营权限。请切换登录 <b>A001</b>。</div>`; return; }
  const [mj, cj] = await Promise.all([
    api("/api/v1/admin/metrics"),
    api("/api/v1/compliance"),
  ]);
  if(!mj.r.ok || !mj.j || !mj.j.data){ app.innerHTML = `<div class="err">看板数据获取失败：${esc(mj.j?mj.j.msg:"网络错误")}</div>`; return; }
  const m = mj.j.data;
  const cm = (cj.j && cj.j.data && cj.j.data.items) || {};
  const gm = m.gmv_cents||0;
  const statusKeys = Object.keys(m.orders_by_status||{});
  const maxStatus = Math.max(1,...statusKeys.map(k=>m.orders_by_status[k]));
  const statusBars = statusKeys.length ? statusKeys.map(k=>{
    const v=m.orders_by_status[k]; const pct=Math.round(v/maxStatus*100);
    return `<div class="row" style="margin:6px 0"><span style="width:120px;font-size:12px;color:var(--muted)">${esc(k)}</span>
      <div class="bar" style="flex:1"><i style="width:${pct}%"></i></div><span style="font-size:12px;width:40px;text-align:right">${v}</span></div>`;
  }).join("") : `<div class="hint">暂无订单</div>`;
  const CARD = {kyc:"用户实名(onboarding)", tax_source:"执行卡1·税源地合作模式", escrow:"执行卡2·支付托管选型", icp:"执行卡3·备案流程"};
  const compItems = ["kyc","tax_source","escrow","icp"];
  const compHtml = compItems.map(it=>`<div class="item">
      <div class="grow"><div style="font-weight:600">${it}</div><div class="hint">${CARD[it]||""}</div></div>
      <span class="status ${cm[it]?'active':'pending'}">${cm[it]?'已落地':'未落地'}</span>
      <button class="btn ${cm[it]?'ghost':''}" onclick="flipCompliance('${it}',${cm[it]?false:true})">${cm[it]?'关闭':'落地'}</button>
    </div>`).join("");
  app.innerHTML = `
    <div class="grid">
      <div class="stat accent"><div class="lab">用户总数</div><div class="val">${m.users_total}</div><div class="sub">接单方 ${m.providers} · 需求方 ${m.requesters} · 运营 ${m.admins}</div></div>
      <div class="stat"><div class="lab">任务总数</div><div class="val">${m.tasks_total}</div><div class="sub">开放中 ${m.tasks_open}</div></div>
      <div class="stat good"><div class="lab">订单总数</div><div class="val">${m.orders_total}</div><div class="sub">已结算 ${m.orders_settled}</div></div>
      <div class="stat warn"><div class="lab">GMV（已结算）</div><div class="val">${money(gm)}</div><div class="sub">平台成交额</div></div>
      <div class="stat accent"><div class="lab">平台资金水位</div><div class="val">${money(m.platform_balance_cents)}</div><div class="sub">全部钱包可用+冻结</div></div>
      <div class="stat ${m.withdrawals_pending>0?'bad':'good'}"><div class="lab">提现</div><div class="val">${m.withdrawals_total}</div><div class="sub">待审批 ${m.withdrawals_pending}</div></div>
      <div class="stat ${m.compliance_red_lights>0?'bad':'good'}"><div class="lab">合规红灯</div><div class="val">${m.compliance_red_lights}</div><div class="sub">未落地合规卡点</div></div>
    </div>
    <div class="panel" style="margin-top:18px">
      <h2>订单状态分布</h2>${statusBars}
    </div>
    <div class="panel" style="margin-top:18px">
      <h2>平台合规闸门（方案2 合规线 C）<span class="tag">仅 A001</span></h2>
      <div class="hint" style="margin-bottom:10px">落地后对应交易动作方可放行。接单需 <b>税源地</b>，托管需 <b>支付托管</b>，结算需 <b>ICP 备案</b>。</div>
      ${compHtml}
    </div>`;
}
async function flipCompliance(item, on){
  const {r,j} = await api("/api/v1/compliance",{method:"POST",body:JSON.stringify({item,on})});
  if(r.ok){ toast("合规项 "+item+(on?" 已落地":" 已关闭")); renderDash(); }
  else toast("失败："+(j?j.msg:"网络错误"));
}

// ---- 组织治理 ----
async function renderOrgs(){
  const app = document.getElementById("app");
  if(!ME){ app.innerHTML = `<div class="empty">请先登录以管理组织。</div>`; return; }
  app.innerHTML = `<div class="section-title">组织治理 <span class="tag">企业版 · 多租户</span></div>
    <div class="panel">
      <h2>创建组织</h2>
      <div class="row">
        <input class="inp" id="org_name" placeholder="组织名称（如：XX 科技外包部）" style="min-width:280px">
        <button class="btn" onclick="createOrg()">创建</button>
      </div>
      <div id="org_create_msg"></div>
    </div>
    <div class="section-title">我的组织</div>
    <div id="orglist"><div class="empty">加载中…</div></div>`;
  const {r,j} = await api("/api/v1/orgs");
  const list = (r.ok && j && j.data) ? j.data : [];
  const el = document.getElementById("orglist");
  if(!list.length){ el.innerHTML = `<div class="hint">还没有组织。上方创建一个，或切换其他账号查看其名下组织。</div>`; return; }
  el.innerHTML = `<div class="grid">${list.map(o=>`
    <div class="card" onclick="location.hash='#org/${esc(o.id)}'">
      <h3>${esc(o.name)}</h3>
      <div class="meta">${esc(o.id)} · 计划 ${esc(o.plan)} · ${esc(o.status)}</div>
    </div>`).join("")}</div>`;
}
async function createOrg(){
  const name = document.getElementById("org_name").value.trim();
  const msg = document.getElementById("org_create_msg");
  if(!name){ msg.innerHTML = `<div class="err">请填写组织名称</div>`; return; }
  const {r,j} = await api("/api/v1/orgs",{method:"POST",body:JSON.stringify({name})});
  if(r.ok && j && j.data){ msg.innerHTML = `<div class="ok">已创建：${esc(j.data.name)} (${esc(j.data.id)})</div>`;
    document.getElementById("org_name").value=""; renderOrgs(); }
  else msg.innerHTML = `<div class="err">创建失败：${esc(j?j.msg:"网络错误")}</div>`;
}

// ---- 组织详情 ----
let ORG_TAB = "overview";
async function renderOrg(orgID){
  const app = document.getElementById("app");
  if(!ME){ app.innerHTML = `<div class="empty">请先登录。</div>`; return; }
  app.innerHTML = `<div class="section-title">组织 ${esc(orgID)} <a href="#orgs" style="font-size:13px">← 返回组织列表</a></div>
    <div id="orgbody"><div class="empty">加载中…</div></div>`;
  // 并行拉取
  const [mRes, wRes, tRes, aRes, oRes] = await Promise.all([
    api(`/api/v1/orgs/${orgID}/members`),
    api(`/api/v1/orgs/${orgID}/wallet`),
    api(`/api/v1/orgs/${orgID}/tasks`),
    api(`/api/v1/orgs/${orgID}/approvals`),
    api(`/api/v1/orgs/${orgID}/orders`),
  ]);
  // 校验组织存在 / 成员可见
  if(!mRes.r.ok){ document.getElementById("orgbody").innerHTML = `<div class="err">无法加载组织 ${esc(orgID)}：${esc(mRes.j?mRes.j.msg:"无权限或不存在")}</div>`; return; }
  const members = (mRes.j && mRes.j.data) || [];
  const me = members.find(x=>x.user_id===ME.uid);
  const isMember = !!me;
  const isOwnerAdmin = me && (me.role==="owner"||me.role==="admin");
  const isOwner = me && me.role==="owner";
  const wallet = (wRes.j && wRes.j.data) || {balance_cents:0,frozen_cents:0};
  const tasks = (tRes.j && tRes.j.data) || [];
  const approvals = (aRes.j && aRes.j.data) || [];
  const orders = (oRes.j && oRes.j.data) || [];

  const tabs = [
    ["overview","概览"],["members","成员"],["tasks","任务与接单"],
    ["orders","订单与托管"],["money","资金与审批"],["dev","开放 API / Webhook"]
  ];
  const tabsHtml = tabs.map(([k,lab])=>`<a class="${ORG_TAB===k?'on':''}" onclick="ORG_TAB='${k}';renderOrg('${esc(orgID)}')">${lab}</a>`).join("");
  const body = document.getElementById("orgbody");
  body.innerHTML = `<div class="tabs">${tabsHtml}</div>
    <div class="hint" style="margin-bottom:10px">你的角色：<b>${me?orgRoleLabel(me.role):"非成员（仅可见基础信息）"}</b>
      ${isOwnerAdmin?'· 拥有管理权限':''} ${!isMember?'· 加入该组织后可发包/提现':''}</div>
    <div id="orgtab"></div>`;
  renderOrgTab(orgID, ORG_TAB, {members,wallet,tasks,approvals,orders,isMember,isOwnerAdmin,isOwner,me});
}

function renderOrgTab(orgID, tab, ctx){
  const el = document.getElementById("orgtab");
  const {members,wallet,tasks,approvals,orders,isMember,isOwnerAdmin,isOwner,me} = ctx;
  if(tab==="overview"){
    const avail = (wallet.balance_cents||0)-(wallet.frozen_cents||0);
    el.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
      <div class="stat accent"><div class="lab">组织钱包余额</div><div class="val">${money(wallet.balance_cents)}</div><div class="sub">可用 ${money(avail)}</div></div>
      <div class="stat warn"><div class="lab">冻结金额</div><div class="val">${money(wallet.frozen_cents)}</div><div class="sub">托管/审批预占</div></div>
      <div class="stat"><div class="lab">成员数</div><div class="val">${members.length}</div></div>
      <div class="stat good"><div class="lab">组织任务</div><div class="val">${tasks.length}</div></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2>快速操作</h2>
      <div class="row">
        <button class="btn" onclick="ORG_TAB='tasks';renderOrg('${esc(orgID)}')">发布组织任务</button>
        ${isOwnerAdmin?`<button class="btn ghost" onclick="ORG_TAB='money';renderOrg('${esc(orgID)}')">充值 / 审批提现</button>`:""}
        ${isOwnerAdmin?`<button class="btn ghost" onclick="ORG_TAB='dev';renderOrg('${esc(orgID)}')">配置 API / Webhook</button>`:""}
      </div>
      ${!isMember?`<div class="err" style="margin-top:12px">你不是该组织成员，需由组织主/管理员邀请后方可发包与提现。</div>`:""}
    </div>`;
    return;
  }
  if(tab==="members"){
    let html = members.map(m=>`<div class="item">
      <div class="av">${esc((m.user_id||"?").slice(0,2))}</div>
      <div class="grow"><div style="font-weight:600">${esc(m.user_id)}</div>
        <span class="chip">${orgRoleLabel(m.role)}</span></div>
    </div>`).join("");
    if(isOwnerAdmin){
      html += `<div class="panel" style="margin-top:16px"><h2>邀请成员</h2>
        <div class="row">
          <input class="inp" id="inv_uid" placeholder="被邀请 uid（如 P002 / R001）">
          <select class="inp" id="inv_role">
            <option value="member">成员 member</option>
            <option value="admin">管理员 admin</option>
            <option value="viewer">只读 viewer</option>
          </select>
          <button class="btn" onclick="inviteMember('${esc(orgID)}')">邀请</button>
        </div><div id="inv_msg"></div></div>`;
    }
    el.innerHTML = html || `<div class="empty">暂无成员</div>`;
    return;
  }
  if(tab==="tasks"){
    // 任务 → 订单映射（用于接单后显示托管）
    const orderByTask = {};
    (orders||[]).forEach(o=>{ orderByTask[o.task_id] = o; });
    let html = tasks.length ? tasks.map(t=>{
      const od = orderByTask[t.id];
      let action = "";
      if(t.status==="open"){
        if(ME.role==="provider" && isMember){
          action = `<button class="btn good" onclick="takeOrgTask('${esc(orgID)}','${esc(t.id)}')">接单</button>`;
        } else if(ME.role==="provider" && !isMember){
          action = `<span class="hint">需先由组织主邀请为成员</span>`;
        } else {
          action = `<span class="hint">切换接单方账号登录可认领</span>`;
        }
      } else if(od){
        if(od.status==="pending_escrow" && isOwnerAdmin){
          action = `<button class="btn" onclick="escrowOrgOrder('${esc(orgID)}','${esc(od.id)}')">托管（组织钱包扣款冻结）</button>`;
        } else {
          action = `<span class="chip">订单 ${esc(od.id)}</span><span class="status ${esc(od.status)}">${esc(od.status)}</span>`;
        }
      }
      return `<div class="item">
        <div class="grow"><div style="font-weight:600">${esc(t.title)}</div>
          <div class="hint">${esc(t.id)} · 类目 ${esc(t.category||"-")} · ${money(t.budget_cents)}</div></div>
        <span class="status ${esc(t.status)}">${esc(t.status)}</span>
        ${action?`<div style="flex:0 0 auto">${action}</div>`:""}
      </div>`;
    }).join("")
      : `<div class="empty">该组织还没发布任务</div>`;
    if(isMember){
      html += `<div class="panel" style="margin-top:16px"><h2>发布组织任务</h2>
        <div class="row" style="margin-bottom:8px">
          <input class="inp" id="t_title" placeholder="任务标题" style="min-width:240px">
          ${catOptions("t_cat")}
        </div>
        <div class="row" style="margin-bottom:8px">
          <input class="inp" id="t_budget" placeholder="预算（元，如 200）" style="width:160px">
          <textarea class="inp" id="t_spec" placeholder="任务说明 / 验收标准" style="min-width:280px"></textarea>
        </div>
        <button class="btn" onclick="publishOrgTask('${esc(orgID)}')">发布任务</button>
        <div id="t_msg"></div></div>`;
    } else {
      html += `<div class="err" style="margin-top:12px">非成员，无法发包。请先在「成员」页由组织主邀请。</div>`;
    }
    el.innerHTML = html;
    return;
  }
  if(tab==="orders"){
    const titleById = {};
    (tasks||[]).forEach(t=>{ titleById[t.id]=t.title; });
    let html = `<div class="hint" style="margin-bottom:10px">企业版统一结算视图：所有以本组织名义发包产生的订单，托管资金从<b>组织钱包</b>冻结，结算释放回组织钱包。</div>`;
    html += orders.length ? orders.map(o=>`<div class="item">
      <div class="av">${esc((o.id||"?").slice(0,2))}</div>
      <div class="grow"><div style="font-weight:600">${esc(titleById[o.task_id]||o.task_id)}</div>
        <div class="hint mono">${esc(o.id)} · 接单方 ${esc(o.provider_id)} · 托管 ${esc(o.escrow_id||"-")}</div></div>
      <div style="text-align:right;flex:0 0 auto"><div style="font-weight:700">${money(o.amount_cents)}</div>
        <span class="status ${esc(o.status)}">${esc(o.status)}</span></div>
    </div>`).join("")
      : `<div class="empty">该组织暂无订单（先发布任务 → 切换接单方账号「接单」→ 组织主「托管」）</div>`;
    el.innerHTML = html;
    return;
  }
  if(tab==="money"){
    const avail = (wallet.balance_cents||0)-(wallet.frozen_cents||0);
    let html = `<div class="panel"><h2>组织钱包</h2>
      <div class="kv"><b>余额</b><span>${money(wallet.balance_cents)}</span></div>
      <div class="kv"><b>冻结</b><span>${money(wallet.frozen_cents)}</span></div>
      <div class="kv"><b>可用</b><span style="color:var(--good)">${money(avail)}</span></div></div>`;
    if(isOwnerAdmin){
      html += `<div class="panel"><h2>钱包充值（演示资金入口）</h2>
        <div class="row"><input class="inp" id="dep_amt" placeholder="金额（元）">
          <button class="btn" onclick="depositOrg('${esc(orgID)}')">充值</button></div><div id="dep_msg"></div></div>`;
    }
    if(isMember){
      html += `<div class="panel"><h2>发起提现申请</h2>
        <div class="row"><input class="inp" id="pay_amt" placeholder="金额（元，≤ 可用）">
          <button class="btn warn" onclick="requestPayout('${esc(orgID)}')">申请提现</button></div><div id="pay_msg"></div></div>`;
    }
    // 审批单
    html += `<div class="panel"><h2>提现审批单</h2>`;
    if(approvals.length){
      html += approvals.map(a=>`<div class="item">
        <div class="grow"><div style="font-weight:600">${esc(a.id)}</div>
          <div class="hint">发起人 ${esc(a.created_by)} · ${money(a.amount_cents)} · ${esc(a.type)}</div></div>
        <span class="status ${esc(a.status)}">${esc(a.status)}</span>
        ${isOwnerAdmin && a.status==="pending"?`<button class="btn good" onclick="approvePayout('${esc(orgID)}','${esc(a.id)}',true)">通过</button>
          <button class="btn" style="background:var(--bad)" onclick="approvePayout('${esc(orgID)}','${esc(a.id)}',false)">驳回</button>`:""}
      </div>`).join("");
    } else html += `<div class="empty">暂无审批单</div>`;
    html += `</div>`;
    el.innerHTML = html;
    return;
  }
  if(tab==="dev"){
    el.innerHTML = `<div class="hint">开放 API 与 Webhook 让组织把 HiveGet 嵌入自有系统（任务创建/订单结算/提现审批事件自动回调）。</div>
      <div id="devbody"><div class="empty">加载中…</div></div>`;
    renderOrgDev(orgID, isOwnerAdmin);
    return;
  }
}

async function renderOrgDev(orgID, isOwnerAdmin){
  const el = document.getElementById("devbody");
  const [kRes, wRes, dRes] = await Promise.all([
    api(`/api/v1/orgs/${orgID}/apikeys`),
    api(`/api/v1/orgs/${orgID}/webhooks`),
    api(`/api/v1/orgs/${orgID}/webhook-deliveries`),
  ]);
  const keys = (kRes.j && kRes.j.data) || [];
  const hooks = (wRes.j && wRes.j.data) || [];
  const deliveries = (dRes.j && dRes.j.data) || [];
  let html = `<div class="panel"><h2>开放 API Key</h2>`;
  html += keys.length ? keys.map(k=>`<div class="item">
    <div class="grow"><div style="font-weight:600">${esc(k.label||k.id)}</div>
      <div class="hint mono">${esc(k.id)} · scopes: ${esc(k.scopes||"-")} · ${esc(k.status)}</div></div>
    <span class="status ${k.status==='active'?'active':'pending'}">${esc(k.status)}</span></div>`).join("")
    : `<div class="empty">尚未生成 API Key</div>`;
  if(isOwnerAdmin){
    html += `<div class="row" style="margin-top:10px">
      <input class="inp" id="k_label" placeholder="标签（如：内部系统）">
      <input class="inp" id="k_scopes" placeholder="scopes: tasks,wallet,webhooks" style="width:220px">
      <button class="btn" onclick="createApiKey('${esc(orgID)}')">生成 Key</button></div>
      <div id="k_msg"></div>`;
  }
  html += `</div>`;
  html += `<div class="panel"><h2>Webhook 订阅</h2>`;
  html += hooks.length ? hooks.map(h=>{
    const ev = (h.events||[]).join(", ");
    return `<div class="item"><div class="grow"><div style="font-weight:600">${esc(h.url)}</div>
      <div class="hint">events: ${esc(ev)} · ${esc(h.status)}</div></div>
      <span class="status ${h.status==='active'?'active':'pending'}">${esc(h.status)}</span></div>`;
  }).join("") : `<div class="empty">尚未订阅 Webhook</div>`;
  if(isOwnerAdmin){
    html += `<div class="row" style="margin-top:10px">
      <input class="inp" id="w_url" placeholder="回调 URL（如 https://example.com/hook）" style="min-width:300px">
      <input class="inp" id="w_events" placeholder="events: task_created,order_settled,payout_approved" style="width:280px">
      <button class="btn" onclick="createWebhook('${esc(orgID)}')">订阅</button></div>
      <div id="w_msg"></div>`;
  }
  html += `</div>`;
  html += `<div class="panel"><h2>最近 Webhook 投递记录</h2>`;
  html += deliveries.length ? deliveries.slice(0,12).map(d=>`<div class="item">
    <div class="grow"><div class="hint mono">${esc(d.event||"-")} → wh:${esc((d.webhook_id||"").slice(0,10))}</div>
      <div class="hint">状态 ${(d.status||"").toUpperCase()} · 尝试 ${d.attempts||1}</div></div>
    <span class="status ${d.status==='success'?'active':(d.status==='failed'?'pending':'pending')}">${esc(d.status||"")}</span></div>`).join("")
    : `<div class="empty">暂无投递记录（发布组织任务 / 审批提现后会自动触发）</div>`;
  html += `</div>`;
  el.innerHTML = html;
}

// ---- 组织操作 ----
async function inviteMember(orgID){
  const user_id = document.getElementById("inv_uid").value.trim();
  const role = document.getElementById("inv_role").value;
  const msg = document.getElementById("inv_msg");
  if(!user_id){ msg.innerHTML=`<div class="err">请填被邀请 uid</div>`; return; }
  const {r,j} = await api(`/api/v1/orgs/${orgID}/members`,{method:"POST",body:JSON.stringify({user_id,role})});
  if(r.ok){ msg.innerHTML=`<div class="ok">已邀请 ${esc(user_id)} 为 ${orgRoleLabel(role)}</div>`; renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}
async function depositOrg(orgID){
  const yuan = parseFloat(document.getElementById("dep_amt").value);
  const msg = document.getElementById("dep_msg");
  if(!(yuan>0)){ msg.innerHTML=`<div class="err">请填正数金额</div>`; return; }
  const {r,j} = await api(`/api/v1/orgs/${orgID}/wallet/deposit`,{method:"POST",body:JSON.stringify({amount_cents:Math.round(yuan*100)})});
  if(r.ok){ msg.innerHTML=`<div class="ok">充值成功：${money((j.data||{}).balance_cents)}</div>`; renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}
async function publishOrgTask(orgID){
  const title = document.getElementById("t_title").value.trim();
  const category = document.getElementById("t_cat").value;
  const yuan = parseFloat(document.getElementById("t_budget").value);
  const spec = document.getElementById("t_spec").value.trim();
  const msg = document.getElementById("t_msg");
  if(!title||!(yuan>0)){ msg.innerHTML=`<div class="err">标题与正数预算必填</div>`; return; }
  const {r,j} = await api(`/api/v1/orgs/${orgID}/tasks`,{method:"POST",body:JSON.stringify({title,category,budget_cents:Math.round(yuan*100),spec})});
  if(r.ok){ msg.innerHTML=`<div class="ok">已发布组织任务：${esc((j.data&&j.data.task&&j.data.task.id)||"")}</div>`;
    document.getElementById("t_title").value=""; document.getElementById("t_budget").value=""; document.getElementById("t_spec").value="";
    renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}
async function requestPayout(orgID){
  const yuan = parseFloat(document.getElementById("pay_amt").value);
  const msg = document.getElementById("pay_msg");
  if(!(yuan>0)){ msg.innerHTML=`<div class="err">请填正数金额</div>`; return; }
  const {r,j} = await api(`/api/v1/orgs/${orgID}/payouts`,{method:"POST",body:JSON.stringify({amount_cents:Math.round(yuan*100)})});
  if(r.ok){ msg.innerHTML=`<div class="ok">已提交提现申请，待组织主/管理员审批</div>`; renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}
async function approvePayout(orgID, approvalID, approve){
  const {r,j} = await api(`/api/v1/orgs/${orgID}/approvals/${approvalID}/approve`,{method:"POST",body:JSON.stringify({approve})});
  if(r.ok){ toast(approve?"已通过":"已驳回"); renderOrg(orgID); }
  else toast("失败："+(j?j.msg:"网络错误"));
}
async function createApiKey(orgID){
  const label = document.getElementById("k_label").value.trim()||"未命名";
  const scopes = document.getElementById("k_scopes").value.trim()||"tasks,wallet,webhooks";
  const msg = document.getElementById("k_msg");
  const {r,j} = await api(`/api/v1/orgs/${orgID}/apikeys`,{method:"POST",body:JSON.stringify({label,scopes})});
  if(r.ok){ const raw=(j.data&&j.data.key)||"";
    msg.innerHTML=`<div class="ok">API Key 已生成（明文仅此一次，请妥善保存）：</div><div class="mono" style="margin-top:6px;color:var(--warn)">${esc(raw)}</div>`;
    renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}
async function createWebhook(orgID){
  const url = document.getElementById("w_url").value.trim();
  const events = document.getElementById("w_events").value.split(",").map(s=>s.trim()).filter(Boolean);
  const msg = document.getElementById("w_msg");
  if(!url){ msg.innerHTML=`<div class="err">请填回调 URL</div>`; return; }
  const {r,j} = await api(`/api/v1/orgs/${orgID}/webhooks`,{method:"POST",body:JSON.stringify({url,events})});
  if(r.ok){ msg.innerHTML=`<div class="ok">Webhook 已订阅</div>`; document.getElementById("w_url").value="";
    document.getElementById("w_events").value=""; renderOrg(orgID); }
  else msg.innerHTML=`<div class="err">失败：${esc(j?j.msg:"网络错误")}</div>`;
}

async function takeOrgTask(orgID, taskID){
  const {r,j} = await api(`/api/v1/tasks/${taskID}/take`,{method:"POST",body:JSON.stringify({milestones:[]})});
  if(r.ok && j && j.data){ toast("接单成功，订单待托管："+(j.data.id||"")); ORG_TAB="orders"; renderOrg(orgID); }
  else toast("接单失败："+(j?j.msg:"网络错误"));
}
async function escrowOrgOrder(orgID, orderID){
  const {r,j} = await api(`/api/v1/orders/${orderID}/escrow`,{method:"POST"});
  if(r.ok && j && j.data){ toast("托管成功，组织钱包已冻结 "+money(j.data.amount_cents)); ORG_TAB="orders"; renderOrg(orgID); }
  else toast("托管失败："+(j?j.msg:"网络错误"));
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d);
  setTimeout(()=>d.remove(),2600); }

(async function init(){
  await loadMe(); await loadCats(); renderAuth(); renderNav(); route();
})();
</script>
</body>
</html>
