<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>任务与订单 · 联赞 LinkZam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-system.css"/>
<style>
  :root{--c-danger:#DC2626;--c-success:#16A34A;--c-danger-soft:rgba(220,38,38,.08);}
  .appbar{position:sticky;top:0;z-index:50;height:var(--nav-h);background:var(--glass-bg-strong);backdrop-filter:blur(14px);border-bottom:1px solid var(--color-border);display:flex;align-items:center;padding:0 18px;gap:14px}
  .appbar .brand{font-weight:800;display:flex;align-items:center;gap:9px}
  .appbar .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
  .main{padding:26px;max-width:880px;margin:0 auto}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--color-border);font-size:.92rem}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--color-muted-foreground)}
  .kv .v{font-weight:700;text-align:right}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
  .revbox{margin-top:14px;padding:16px;background:var(--color-muted);border-radius:var(--radius);display:none}
  .revbox.show{display:block}
  .deliv{font-size:.88rem;padding:12px;border-left:3px solid var(--color-primary);background:var(--glass-bg);border-radius:8px;margin-bottom:10px}
  .deliv-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .deliv-head .round{font-weight:700}
  .deliv-head .meta{margin-left:auto;font-size:.78rem;color:var(--color-muted-foreground)}
  .deliv-body{white-space:pre-wrap;word-break:break-word;line-height:1.5;margin-bottom:8px}
  .deliv-items{display:flex;flex-direction:column;gap:6px}
  .di{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:var(--color-muted);border-radius:7px;font-size:.84rem}
  .di .di-id{font-weight:700;color:var(--color-primary);min-width:24px}
  .di .di-txt{flex:1;white-space:pre-wrap;word-break:break-word}
  .di .di-x{color:var(--c-danger);font-weight:700}
  .di .di-v{color:var(--c-success);font-weight:700}
  .reqlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .reqitem{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--glass-bg);border:1px solid var(--color-border);border-radius:8px}
  .reqitem .rid{font-weight:800;color:var(--color-primary);min-width:30px}
  .reqitem .rdesc{flex:1;font-weight:600;line-height:1.45}
  .section-title{margin:22px 0 10px;font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px}
  /* 验收比对 */
  .acpt{border:1px solid var(--color-border);border-radius:12px;overflow:hidden;margin-top:10px}
  .acpt-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:12px;padding:12px 14px;border-bottom:1px solid var(--color-border);align-items:start}
  .acpt-row:last-child{border-bottom:none}
  .acpt-row .ai-req{font-weight:600;line-height:1.45}
  .acpt-row .ai-req .rid{color:var(--color-primary);font-weight:800;margin-right:6px}
  .acpt-row .ai-prov{font-size:.84rem;color:var(--color-muted-foreground);white-space:pre-wrap;word-break:break-word;background:var(--color-muted);padding:8px 10px;border-radius:8px}
  .acpt-row .ai-prov .prov-done{color:var(--c-success);font-weight:700}
  .acpt-row .ai-prov .prov-miss{color:var(--c-danger);font-weight:700}
  .passchk{display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600;cursor:pointer;user-select:none}
  .severe{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:13px 15px;background:var(--c-danger-soft);border:1px solid var(--c-danger);border-radius:12px;color:var(--c-danger);font-weight:600}
  .severe input{margin-top:3px}
  .banner-danger{margin-top:12px;padding:12px 14px;background:var(--c-danger-soft);border:1px solid var(--c-danger);border-radius:12px;color:var(--c-danger);font-weight:700}
  .banner-ok{margin-top:12px;padding:12px 14px;background:rgba(22,163,74,.08);border:1px solid var(--c-success);border-radius:12px;color:var(--c-success);font-weight:700}
  .item-form{margin-top:12px;padding:14px;background:var(--color-muted);border-radius:12px}
  .item-form .if-row{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin-bottom:8px;font-size:.86rem}
  .item-form .if-row .if-desc{font-weight:600}
  input.if-note,input.if-link{width:100%}
  .hidden{display:none !important}
  .quote-range{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:1.6rem;color:var(--color-primary)}
  .quote-range .q-arrow{color:var(--color-muted-foreground);font-weight:600}
  .quote-range .q-min,.quote-range .q-max{letter-spacing:-.5px}
  .quote-reason{margin:12px 0 4px;padding-left:18px;color:var(--color-muted-foreground);font-size:.84rem;line-height:1.7}
  .quote-reason li{margin-bottom:2px}
  /* B3 IM 沟通面板 */
  .chat{margin-top:18px;border:1px solid var(--color-border);border-radius:14px;overflow:hidden;background:var(--glass-bg)}
  .chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--color-border);font-weight:700}
  .chat-head .peer-id{font-size:.82rem;font-weight:600;color:var(--color-muted-foreground)}
  .chat-head .ai-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--color-muted-foreground);cursor:pointer;user-select:none}
  .chat-msgs{max-height:340px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--color-muted)}
  .bubble{max-width:80%;padding:9px 12px;border-radius:13px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .bubble.me{align-self:flex-end;background:var(--color-primary);color:#fff;border-bottom-right-radius:4px}
  .bubble.peer{align-self:flex-start;background:var(--glass-bg-strong);border:1px solid var(--color-border);border-bottom-left-radius:4px}
  .bubble.sys{align-self:center;background:transparent;color:var(--color-muted-foreground);font-size:.78rem;max-width:92%;text-align:center}
  .bubble.ai{align-self:flex-start;background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(168,85,247,.12));border:1px dashed var(--color-accent);border-bottom-left-radius:4px}
  .bubble .badge{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;margin-bottom:5px}
  .bubble .badge.ai-badge{background:var(--color-accent);color:#fff}
  .bubble .badge.suggest-badge{background:rgba(99,102,241,.18);color:var(--color-primary)}
  .bubble .meta{display:block;font-size:.66rem;opacity:.6;margin-top:3px}
  .chat-input{padding:12px;border-top:1px solid var(--color-border);display:flex;flex-direction:column;gap:8px}
  .chat-input textarea{width:100%;resize:none;height:44px}
  .chat-input .row2{display:flex;gap:8px;justify-content:flex-end}
  .btn.ai-suggest{border-color:var(--color-accent);color:var(--color-accent)}
  .chat-hint{font-size:.76rem;color:var(--color-accent);font-weight:600;min-height:18px;margin-bottom:2px}
  /* C1 AI 需求翻译 / 需求分析 面板 */
  .ai-doc{white-space:pre-wrap;word-break:break-word;font-size:.9rem;line-height:1.65;background:var(--glass-bg-strong);border:1px solid var(--color-border);border-radius:10px;padding:12px 14px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:.72rem;background:rgba(99,102,241,.14);color:var(--color-primary);border-radius:999px;padding:2px 10px}
  .status.llm{background:var(--color-accent);color:#fff;font-size:.68rem;padding:1px 8px;border-radius:999px;margin-left:6px}
  .an-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .an-sec{background:var(--glass-bg-strong);border:1px solid var(--color-border);border-radius:10px;padding:10px 12px}
  .an-h{font-weight:700;font-size:.82rem;margin-bottom:6px;color:var(--color-primary)}
  .an-ul{margin:0;padding-left:18px}
  .an-ul li{font-size:.86rem;line-height:1.55;margin-bottom:3px;word-break:break-word}
  @media(max-width:560px){.an-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="appbar">
  <a class="brand" href="app.html"><span class="logo">蜂</span> 联赞</a>
  <button class="btn btn-ghost btn-sm" onclick="location.href='app.html'">← 返回工作台</button>
</div>

<div class="main" id="main"><div class="empty glass card">加载中…</div></div>
<div id="toast"></div>

<script>
const API="/api/v1";
let TOKEN=localStorage.getItem("hg_token")||"";
let ME=null;
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function money(c){return "¥"+(c/100).toLocaleString("zh-CN");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function statusPill(s){const L={delivered:"待验收",accepted:"已验收",rejected:"已打回",delivering:"修正中",disputed:"纠纷中",escrowed:"已托管",pending_settlement:"待结算",taken:"已接单",completed:"已完成"};return `<span class="status ${esc(s)}">${L[s]||esc(s)}</span>`;}
function fmtTime(ms){if(!ms)return"-";try{const d=new Date(ms);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}catch(e){return String(ms);}}

async function api(path,opts={}){
  try{const r=await fetch(API+path,{method:opts.method||"GET",headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN},body:opts.body?JSON.stringify(opts.body):undefined});
  let j=null;try{j=await r.json()}catch(e){}return {r,j};}catch(e){return {r:{ok:false},j:{msg:String(e)}};}
}

(async function(){
  if(!TOKEN){location.href="auth.html";return;}
  const {r,j}=await api("/auth/me");
  if(!r.ok||!j.data){location.href="auth.html";return;}
  ME=j.data;ME.uid=ME.uid||localStorage.getItem("hg_uid");ME.role=ME.role||"requester";
  const q=new URLSearchParams(location.search);
  if(q.get("order")) await renderOrder(q.get("order"));
  else if(q.get("task")) await renderTask(q.get("task"));
  else $("#main").innerHTML=`<div class="empty glass card">缺少参数</div>`;
})();

function reqItemsOf(task){return (task&&task.spec_obj&&task.spec_obj.items)||[];}

async function renderTask(id){
  const {r,j}=await api("/tasks/"+encodeURIComponent(id));
  if(!r.ok||!j.data){$("#main").innerHTML=`<div class="empty glass card">任务不存在</div>`;return;}
  const t=j.data.task||j.data;
  const items=reqItemsOf(t);
  let html=`<div class="page-head"><h2>${esc(t.title)}</h2>${statusPill(t.status||"open")}</div>
  <div class="glass card card-lg">
    <div class="kv"><span class="k">任务 ID</span><span class="v mono">${esc(t.id)}</span></div>
    <div class="kv"><span class="k">类目</span><span class="v">${esc(t.category||"-")}</span></div>
    <div class="kv"><span class="k">预算</span><span class="v">${money(t.budget_cents||0)}</span></div>
    <div class="kv"><span class="k">发布方</span><span class="v">${esc(t.requester_id||"-")}</span></div>
    <div class="kv"><span class="k">需求描述</span><span class="v">${esc(t.spec||"-")}</span></div>
    ${(t.spec_obj&&t.spec_obj.deliverables)?`<div class="kv"><span class="k">交付物</span><span class="v">${esc(t.spec_obj.deliverables)}</span></div>`:""}
  </div>`;
  if(items.length){
    html+=`<div class="section-title">📋 需求清单（验收标尺）</div><div class="glass card card-lg"><div class="reqlist">`+
      items.map(it=>`<div class="reqitem"><span class="rid">${esc(it.id)}</span><span class="rdesc">${esc(it.desc)}</span></div>`).join("")+
      `</div></div>`;
  }
  // C1 AI 需求翻译（需求方生成，帮助接单方/双方精准理解需求）
  html+=`<div class="section-title">🤖 AI 需求翻译（清晰需求书）</div>
    <div class="glass card card-lg" id="translateCard"><div class="muted">${ME.role==="requester"?"点击生成 AI 需求翻译，帮助接单方精准理解你的需求":"等待需求方生成 AI 需求翻译…"}</div></div>
    ${ME.role==="requester"?`<div class="actions"><button class="btn btn-primary" id="genTranslateBtn">生成 / 重生成 AI 需求翻译</button></div>`:``}`;
  // C1 AI 需求分析（接单方侧，拆解目标/交付物/验收/易误解点/需确认项，防止理解偏差）
  html+=`<div class="section-title">🧠 AI 需求分析（接单方校核）</div>
    <div class="glass card card-lg" id="analyzeCard"><div class="muted">点击生成 AI 需求分析，自动拆解核心目标 / 交付物 / 验收要点 / 易误解点 / 需确认项。</div></div>
    <div class="actions"><button class="btn btn-primary" id="genAnalyzeBtn">生成 AI 需求分析</button></div>`;
  if(ME.role==="provider"&&(t.status||"open")==="open"){
    html+=`<div class="section-title">🤖 AI 建议报价（接单方）</div>
      <div class="glass card card-lg" id="quoteCard"><div class="muted">正在为你估算合理报价…</div></div>
      <div class="actions"><button class="btn btn-primary" id="takeBtn">仅接单（不报价）</button></div>`;
  }
  $("#main").innerHTML=html;
  loadTranslate(id,t);
  loadAnalyze(id,t);
  const gt=$("#genTranslateBtn"); if(gt) gt.onclick=()=>genTranslate(id);
  const ga=$("#genAnalyzeBtn"); if(ga) ga.onclick=()=>genAnalyze(id);
  if(ME.role==="provider"&&(t.status||"open")==="open"){ loadQuote(id,t); }
  if($("#takeBtn")) $("#takeBtn").onclick=async()=>{
    const {r,j}=await api("/tasks/"+encodeURIComponent(id)+"/take",{method:"POST",body:{milestones:[]}});
    if(r.ok){toast("接单成功，等待需求方托管");location.href="app.html#myorders";}
    else toast((j&&j.msg)||"接单失败");
  };
}

// loadQuote 接单方视角：拉取 AI 建议报价并渲染（含采纳为报价后接单）。
async function loadQuote(id,t){
  const card=$("#quoteCard"); if(!card) return;
  const {r,j}=await api("/quote",{method:"POST",body:{task_id:id}});
  if(!r.ok){ card.innerHTML=`<div class="muted">建议报价暂不可用：${(j&&j.msg)||""}</div>`; return; }
  const q=j.data;
  const below=q.below_estimate?`<div class="banner-danger">⚠️ 需求方预算 ${money(t.budget_cents||0)} 低于建议下限，建议还价或审慎承接</div>`:"";
  card.innerHTML=`<div class="quote-range"><span class="q-min">${money(q.min_cents)}</span><span class="q-arrow">～</span><span class="q-max">${money(q.max_cents)}</span></div>
    <div class="muted tiny">建议锚定价 ${money(q.anchor_cents)}（基于类目 / 复杂度 / 紧急度 / 你的成交与口碑画像）</div>
    <ul class="quote-reason">${(q.rationale||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${below}
    <button class="btn btn-ghost" id="adoptQuote">采纳建议并接单（${money(q.anchor_cents)}）</button>`;
  const ab=$("#adoptQuote");
  if(ab) ab.onclick=async()=>{
    const {r,j}=await api("/tasks/"+encodeURIComponent(id)+"/take",{method:"POST",body:{milestones:[],provider_quote_cents:q.anchor_cents}});
    if(r.ok){toast("已采纳 AI 建议报价并接单，等待需求方托管");location.href="app.html#myorders";}
    else toast((j&&j.msg)||"接单失败");
  };
}

// ---- C1 AI 需求翻译 / 需求分析 前端逻辑 ----

function renderTranslateCard(tr){
  const m=tr.mode?`<span class="status llm">${tr.mode==="llm"?"AI 润色":"规则生成"}</span>`:"";
  const sec=(tr.sections&&tr.sections.length)?`<div class="tags">${tr.sections.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`:"";
  return `<div class="ai-doc">${esc(tr.doc)}</div>${sec}<div class="meta tiny">${m}</div>`;
}
function renderAnalyzeCard(an){
  const sect=(title,arr)=> (arr&&arr.length)?`<div class="an-sec"><div class="an-h">${title}</div><ul class="an-ul">${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  const m=an.mode?`<span class="status llm">${an.mode==="llm"?"AI 分析":"规则分析"}</span>`:"";
  return `<div class="an-grid">${sect("🎯 核心目标",an.core_goal?[an.core_goal]:[])}${sect("📦 交付物",an.deliverables)}${sect("✅ 验收要点",an.acceptance_points)}${sect("⚠️ 易误解点",an.misunderstandings)}${sect("❓ 需向需求方确认",an.need_confirm)}</div><div class="meta tiny">${m}</div>`;
}
async function loadTranslate(id,t){
  const card=$("#translateCard"); if(!card) return;
  if(t.translation){ try{ const tr=JSON.parse(t.translation); card.innerHTML=renderTranslateCard(tr); return; }catch(e){} }
}
async function loadAnalyze(id,t){
  const card=$("#analyzeCard"); if(!card) return;
  if(t.analysis_json){ try{ const an=JSON.parse(t.analysis_json); card.innerHTML=renderAnalyzeCard(an); return; }catch(e){} }
}
async function genTranslate(id){
  const card=$("#translateCard"); if(!card) return;
  card.innerHTML=`<div class="muted">正在生成 AI 需求翻译…</div>`;
  const {r,j}=await api("/tasks/"+encodeURIComponent(id)+"/translate",{method:"POST"});
  if(!r.ok){ card.innerHTML=`<div class="muted">生成失败：${(j&&j.msg)||""}</div>`; return; }
  card.innerHTML=renderTranslateCard(j.data);
  toast("AI 需求翻译已生成");
}
async function genAnalyze(id){
  const card=$("#analyzeCard"); if(!card) return;
  card.innerHTML=`<div class="muted">正在生成 AI 需求分析…</div>`;
  const {r,j}=await api("/tasks/"+encodeURIComponent(id)+"/analyze",{method:"POST"});
  if(!r.ok){ card.innerHTML=`<div class="muted">生成失败：${(j&&j.msg)||""}</div>`; return; }
  card.innerHTML=renderAnalyzeCard(j.data);
  toast("AI 需求分析已生成");
}

async function renderOrder(id){
  const {r,j}=await api("/orders/"+encodeURIComponent(id));
  if(!r.ok||!j.data){$("#main").innerHTML=`<div class="empty glass card">订单不存在</div>`;return;}
  const o=j.data.order||j.data;
  const task=j.data.task||{};
  const deliveries=j.data.deliveries||[];
  const isReq=(o.requester_id===ME.uid), isProv=(o.provider_id===ME.uid);
  const rr=await api("/orders/"+encodeURIComponent(id)+"/reviews");
  const reviews=(rr.r.ok&&rr.j.data&&rr.j.data.reviews)?rr.j.data.reviews:[];
  const items=reqItemsOf(task);
  const last=deliveries.length?deliveries[deliveries.length-1]:null;
  const delivMap={};(last&&last.items?last.items:[]).forEach(d=>delivMap[d.item_id]=d);
  o._delivMap=delivMap; o._lastContent=(last&&last.content)||"";

  let html=`<div class="page-head"><h2>订单 ${esc(o.id)}</h2>${o.resolved_at?`<span class="status disputed">仲裁结案</span>`:statusPill(o.status)}</div>
  <div class="glass card card-lg">
    <div class="kv"><span class="k">任务</span><span class="v mono">${esc(o.task_id)}</span></div>
    <div class="kv"><span class="k">金额</span><span class="v">${money(o.amount_cents||0)}</span></div>
    <div class="kv"><span class="k">需求方</span><span class="v">${esc(o.requester_id)}</span></div>
    <div class="kv"><span class="k">接单方</span><span class="v">${esc(o.provider_id)}</span></div>
    ${(o.provider_quote_cents)?`<div class="kv"><span class="k">接单方报价</span><span class="v">${money(o.provider_quote_cents)}</span></div>`:""}
    ${o.escrow_id?`<div class="kv"><span class="k">托管号</span><span class="v mono">${esc(o.escrow_id)}</span></div>`:""}
  </div>`;

  // 需求清单（始终展示，作为比对标尺）
  if(items.length){
    html+=`<div class="section-title">📋 需求清单</div><div class="glass card card-lg"><div class="reqlist">`+
      items.map(it=>`<div class="reqitem"><span class="rid">${esc(it.id)}</span><span class="rdesc">${esc(it.desc)}</span></div>`).join("")+
      `</div></div>`;
  }

  html+=`<div class="actions" id="acts">${actionButtons(o,isReq,isProv)}</div>`;

  // 交付记录（逐轮 + 逐需求项）
  html+=`<div class="section-title">📦 交付记录（${deliveries.length}）</div>`;
  html+= deliveries.length? deliveries.map(d=>{
    const di=(d.items||[]).map(it=>{
      const ok=!!it.done;
      return `<div class="di"><span class="di-id">${esc(it.item_id)}</span><span class="di-txt">${esc(it.note||"(无说明)")}${it.link?` · <a href="${esc(it.link)}" target="_blank" rel="noopener">链接</a>`:""}</span><span class="${ok?'di-v':'di-x'}">${ok?'✓':'✗'}</span></div>`;
    }).join("");
    return `<div class="deliv"><div class="deliv-head"><span class="round">第 ${esc(d.round||1)} 轮</span>${statusPill(d.status)}<span class="meta">${fmtTime(d.created_at)}</span></div>${d.content?`<div class="deliv-body">${esc(d.content)}</div>`:""}${di?`<div class="deliv-items">${di}</div>`:""}</div>`;
  }).join("") : `<div class="muted tiny">暂无交付记录</div>`;

  // 验收比对区（需求方待验收 / 已完成展示结果 / 纠纷展示裁定）
  html+= renderAcceptance(o, task, items, delivMap, isReq, isProv);

  // 纠纷 / 仲裁信息
  if(o.status==="disputed"||o.resolved_at){
    html+=`<div class="section-title">⚖️ 纠纷与仲裁</div><div class="glass card card-lg">`;
    html+=`<div class="kv"><span class="k">纠纷事由</span><span class="v" style="text-align:left;font-weight:600">${esc(o.dispute_reason||"-")}</span></div>`;
    if(o.resolved_at){
      html+=`<div class="kv"><span class="k">仲裁结果</span><span class="v" style="text-align:left;font-weight:600">退款 ${o.refund_pct||0}%（${money(o.refund_cents||0)}）</span></div>`;
      html+=`<div class="kv"><span class="k">裁决说明</span><span class="v" style="text-align:left;font-weight:600">${esc(o.resolved_note||"-")}</span></div>`;
    } else {
      html+=`<div class="banner-danger">纠纷处理中，等待运营仲裁结案</div>`;
    }
    html+=`</div>`;
  }

  // 评价
  html+=`<div class="revbox" id="revbox">
    <div class="field"><label class="label">评分（1-5）</label><input class="input" id="rv_score" type="number" min="1" max="5" value="5"></div>
    <div class="field"><label class="label">评价内容</label><textarea class="textarea" id="rv_comment" placeholder="评价对方…"></textarea></div>
    <button class="btn btn-primary" id="rvBtn">提交评价</button>
  </div>`;
  html+= reviews.length?`<div class="section-title">💬 双方评价</div>`+reviews.map(rv=>`<div class="item"><div class="av">${esc((rv.reviewer_id||"?").slice(0,2))}</div><div class="grow"><div class="ttl">${esc(rv.reviewer_id)} · ${rv.score||0}★</div><div class="sub">${esc(rv.comment||"")}</div></div></div>`).join("") : "";

  // B3 IM 沟通面板（与对方实时沟通 + AI 客服应答）
  const chatPeer = isReq ? o.provider_id : o.requester_id;
  if(chatPeer){
    html+=`<div class="section-title">💬 沟通</div>
      <div class="chat">
        <div class="chat-head"><span>与对方沟通</span><span class="peer-id">${esc(chatPeer)}</span>
          <label class="ai-toggle"><input type="checkbox" id="aiAutoChk"> 🤖 自动回复</label>
        </div>
        <div class="chat-msgs" id="chatMsgs"><div class="muted tiny">加载中…</div></div>
        <div class="chat-input">
          <div class="chat-hint" id="chatHint"></div>
          <textarea id="chatInput" placeholder="输入消息，或与对方沟通时点击「🤖 AI 建议回复」…"></textarea>
          <div class="row2">
            <button class="btn btn-ghost btn-sm ai-suggest" id="aiSuggestBtn">🤖 AI 建议回复</button>
            <button class="btn btn-primary btn-sm" id="chatSendBtn">发送</button>
          </div>
        </div>
      </div>`;
  }

  $("#main").innerHTML=html;
  bindOrderEvents(o,isReq,isProv,items,delivMap);
  if(chatPeer){ initChat(chatPeer); }
}

// 验收比对：需求方待验收→可逐项勾选 + 严重不符判定；已完成→只读结果；其余→提示
function renderAcceptance(o,task,items,delivMap,isReq,isProv){
  const s=o.status;
  if(s==="delivered" && isReq && items.length){
    let rows=items.map(it=>{
      const d=delivMap[it.id]||{};
      const done=!!d.done;
      return `<div class="acpt-row">
        <div class="ai-req"><span class="rid">${esc(it.id)}</span>${esc(it.desc)}</div>
        <div class="ai-prov">${done?`<span class="prov-done">已完成</span>`:`<span class="prov-miss">未完成</span>`} ${esc(d.note||"")}${d.link?` · <a href="${esc(d.link)}" target="_blank" rel="noopener">链接</a>`:""}</div>
        <label class="passchk"><input type="checkbox" class="acpt-pass" data-id="${esc(it.id)}" ${done?'checked':''}> 达标</label>
      </div>`;
    }).join("");
    return `<div class="section-title">🔍 验收比对（先逐项核对，再判定）</div>
      <div class="glass card card-lg">
        <div class="acpt">${rows}</div>
        <div class="muted tiny" id="acceptHint" style="margin-top:8px">全部勾选「达标」→ 验收并结算放款；存在未勾选（未达标）项 → 该项打回接单方修正后重新提交，订单不结算</div>
        <label class="severe"><input type="checkbox" id="severeChk"> 判定为「需求与完成清单严重不符」（勾选后将以纠纷仲裁处理，而非直接验收）</label>
        <div class="actions" style="margin-top:14px">
          <button class="btn btn-primary" id="acceptBtn">验收并结算</button>
          <button class="btn btn-ghost" id="reviseBtn">打回重做</button>
          <button class="btn btn-danger hidden" id="disputeBtn">发起纠纷</button>
        </div>
      </div>`;
  }
  // 打回修正视图：存在未达标项，订单已回到 delivering，双方可见判定结果
  if(s==="delivering" && (o.acceptance||[]).length && items.length){
    const acc=o.acceptance||[];
    const amap={};acc.forEach(a=>amap[a.item_id]=a);
    const failCnt=acc.filter(a=>!a.pass).length;
    let rows=items.map(it=>{
      const a=amap[it.id];
      if(!a) return `<div class="acpt-row"><div class="ai-req"><span class="rid">${esc(it.id)}</span>${esc(it.desc)}</div><div class="ai-prov"><span class="muted">本轮未判定</span></div><div class="passchk">-</div></div>`;
      const pass=a.pass;
      return `<div class="acpt-row"><div class="ai-req"><span class="rid">${esc(it.id)}</span>${esc(it.desc)}</div><div class="ai-prov">验收${pass?`<span class="prov-done">达标</span>`:`<span class="prov-miss">未达标</span>`}${a.note?` · ${esc(a.note)}`:""}</div><div class="passchk">${pass?'✓':'✗'}</div></div>`;
    }).join("");
    const hint=isProv
      ?`<div class="banner-danger">您有 ${failCnt} 项验收未达标，请修正后在下方重新提交交付（订单未结算，托管资金冻结中）</div>`
      :`<div class="banner-danger">存在 ${failCnt} 项未达标，已打回接单方修正；达标项已确认，全部达标后将自动结算</div>`;
    return `<div class="section-title">🔍 验收比对结果（修正中）</div><div class="glass card card-lg">${hint}<div class="acpt">${rows}</div></div>`;
  }
  if(s==="completed" && items.length){
    const acc=o.acceptance||[];
    const disputed = !!o.resolved_at; // 经仲裁结案的订单，不走"验收通过"视图
    if(disputed && !acc.length) return ""; // 纠纷单未逐项验收 → 不渲染比对区，由"纠纷与仲裁"卡片说明结果
    const amap={};acc.forEach(a=>amap[a.item_id]=a);
    let rows=items.map(it=>{
      const a=amap[it.id];
      if(!a) return `<div class="acpt-row"><div class="ai-req"><span class="rid">${esc(it.id)}</span>${esc(it.desc)}</div><div class="ai-prov"><span class="prov-miss">未逐项验收</span></div><div class="passchk">-</div></div>`;
      const pass=a.pass;
      return `<div class="acpt-row"><div class="ai-req"><span class="rid">${esc(it.id)}</span>${esc(it.desc)}</div><div class="ai-prov">验收${pass?`<span class="prov-done">达标</span>`:`<span class="prov-miss">未达标</span>`}${a.note?` · ${esc(a.note)}`:""}</div><div class="passchk">${pass?'✓':'✗'}</div></div>`;
    }).join("");
    const failIds=acc.filter(a=>!a.pass).map(a=>a.item_id);
    let banner;
    if(disputed) banner=`<div class="banner-danger">经仲裁结案：退款 ${o.refund_pct||0}%（${money(o.refund_cents||0)}），详见下方「纠纷与仲裁」</div>`;
    else if(failIds.length) banner=`<div class="banner-danger">已结算，但存在未达标项（${esc(failIds.join("、"))}）—— 本单结算于「未达标打回」机制上线前，属历史数据；现行规则下未达标将无法结算</div>`;
    else if(o.severe_mismatch) banner=`<div class="banner-danger">需求方曾判定：需求与完成清单严重不符（已按纠纷/协商处理）</div>`;
    else banner=`<div class="banner-ok">验收通过，已结算</div>`;
    return `<div class="section-title">🔍 验收比对结果</div><div class="glass card card-lg">${banner}<div class="acpt">${rows}</div></div>`;
  }
  return "";
}

function actionButtons(o,isReq,isProv){
  const s=o.status,b=[];
  if(isReq&&s==="pending_escrow") b.push(`<button class="btn btn-primary" data-act="escrow">托管资金</button>`);
  if(isProv&&(s==="active"||s==="delivering")) b.push(`<button class="btn btn-primary" id="deliverToggle">提交交付</button>`);
  if(isReq&&s==="pending_settlement") b.push(`<button class="btn btn-primary" data-act="settle">补结算</button>`);
  if(s==="completed") b.push(`<button class="btn btn-accent" data-act="review">评价对方</button>`);
  return b.join("")||`<span class="muted tiny">当前状态无可执行操作</span>`;
}

function bindOrderEvents(o,isReq,isProv,items,delivMap){
  const acts=$("#acts");
  if(acts) acts.querySelectorAll("button[data-act]").forEach(b=>b.onclick=()=>onAct(b.dataset.act,o,isReq,isProv,o.id));

  // 提交交付：展开按项表单
  const dt=$("#deliverToggle");
  if(dt) dt.onclick=()=>openDeliverForm(o,items,dt);

  // 验收比对按钮
  const acceptBtn=$("#acceptBtn");
  if(acceptBtn) acceptBtn.onclick=()=>submitAccept(o,false);
  const reviseBtn=$("#reviseBtn");
  if(reviseBtn) reviseBtn.onclick=()=>submitRevise(o);
  const disputeBtn=$("#disputeBtn");
  if(disputeBtn) disputeBtn.onclick=()=>submitDispute(o);
  const severe=$("#severeChk");
  if(severe) severe.onchange=()=>{
    const d=$("#disputeBtn");
    if(d) d.classList.toggle("hidden",!severe.checked);
    const a=$("#acceptBtn");
    if(a) a.classList.toggle("hidden",severe.checked);
  };
  // 达标勾选联动：全达标→「验收并结算」；有未达标→「提交验收（未达标项打回修正）」
  const syncAcceptLabel=()=>{
    const a=$("#acceptBtn"); if(!a) return;
    const boxes=document.querySelectorAll(".acpt-pass");
    const allPass=[...boxes].every(c=>c.checked);
    a.textContent = boxes.length && !allPass ? "提交验收（未达标项将打回修正）" : "验收并结算";
  };
  document.querySelectorAll(".acpt-pass").forEach(c=>{ c.onchange=syncAcceptLabel; });
  syncAcceptLabel();

  const rv=$("#rvBtn");
  if(rv) rv.onclick=async()=>{
    const rating=parseInt($("#rv_score").value||"5",10);
    const comment=$("#rv_comment").value.trim();
    const reviewee=isReq?o.provider_id:o.requester_id;
    const {r,j}=await api("/orders/"+encodeURIComponent(o.id)+"/review",{method:"POST",body:{rating,comment,reviewee_id:reviewee}});
    toast((r.ok&&j.msg)||(j&&j.msg)||"评价失败");if(r.ok)location.reload();
  };
  bindChatEvents();
}

function openDeliverForm(o,items,btn){
  const existing=$("#deliverForm");
  if(existing){existing.remove();return;}
  const id=o.id;
  let rows="";
  if(items.length){
    rows=items.map(it=>{
      const d=(o._delivMap&&o._delivMap[it.id])||{};
      return `<div class="if-row"><span class="if-desc">${esc(it.id)} ${esc(it.desc)}</span>
        <span><input class="input if-note" placeholder="完成说明" value="${esc(d.note||"")}"><input class="input if-link" placeholder="交付链接(可选)" value="${esc(d.link||"")}"></span>
        <label class="passchk"><input type="checkbox" class="if-done" ${d.done?'checked':''}> 完成</label></div>`;
    }).join("");
  }
  const form=document.createElement("div");
  form.id="deliverForm";
  form.className="item-form";
  form.innerHTML=`<div class="field"><label class="label">交付总说明</label><textarea class="textarea" id="dv_content" placeholder="整体交付说明（可贴下载链接/提取码）">${esc((o._lastContent)||"")}</textarea></div>`+
    (rows?`<div class="field"><label class="label">逐项完成情况</label>${rows}</div>`:"")+
    `<button class="btn btn-primary" id="dv_submit">确认提交交付</button> <button class="btn btn-ghost" id="dv_cancel">取消</button>`;
  btn.insertAdjacentElement("afterend",form);
  $("#dv_cancel").onclick=()=>form.remove();
  $("#dv_submit").onclick=async()=>{
    const content=$("#dv_content").value.trim();
    let dvItems=[];
    if(items.length){
      form.querySelectorAll(".if-row").forEach(row=>{
        const desc=row.querySelector(".if-desc").textContent.split(" ")[0]; // 取 item id
        const itemId=desc.trim();
        const note=row.querySelector(".if-note").value.trim();
        const link=row.querySelector(".if-link").value.trim();
        const done=row.querySelector(".if-done").checked;
        dvItems.push({item_id:itemId,done,note,link});
      });
    }
    const {r,j}=await api("/orders/"+encodeURIComponent(id)+"/deliver",{method:"POST",body:{content,items:dvItems}});
    toast((r.ok&&j.msg)||(j&&j.msg)||"交付失败");if(r.ok)location.reload();
  };
}

async function submitAccept(o,severe){
  const items=[];
  document.querySelectorAll(".acpt-pass").forEach(c=>{
    items.push({item_id:c.dataset.id,pass:c.checked,note:""});
  });
  const {r,j}=await api("/orders/"+encodeURIComponent(o.id)+"/accept",{method:"POST",body:{acceptance:items,severe_mismatch:severe}});
  toast((r.ok&&j.msg)||(j&&j.msg)||"验收失败");if(r.ok)location.reload();
}

async function submitRevise(o){
  const note=prompt("打回重做意见（可选）：")||"";
  const {r,j}=await api("/orders/"+encodeURIComponent(o.id)+"/revise",{method:"POST",body:{note}});
  toast((r.ok&&j.msg)||(j&&j.msg)||"打回失败");if(r.ok)location.reload();
}

async function submitDispute(o){
  const reason=prompt("请说明纠纷事由（需求与完成清单严重不符的具体情况）：");
  if(!reason)return;
  const {r,j}=await api("/orders/"+encodeURIComponent(o.id)+"/dispute",{method:"POST",body:{reason}});
  toast((r.ok&&j.msg)||(j&&j.msg)||"发起纠纷失败");if(r.ok)location.reload();
}

async function onAct(act,o,isReq,isProv,id){
  const map={escrow:"托管资金",settle:"补结算",review:"评价"};
  let path="/orders/"+encodeURIComponent(id),body={};
  if(act==="escrow") path+="/escrow";
  if(act==="settle") path+="/settle";
  const {r,j}=await api(path,{method:"POST",body});
  toast((r.ok&&j.msg)||(j&&j.msg)||(map[act]+"失败"));if(r.ok)location.reload();
}

// ---- B3 IM 沟通面板（与对方实时沟通 + AI 客服应答） ----
let chatPeer=null, chatTimer=null, pendingSuggest=false;

async function initChat(peer){
  chatPeer=peer; pendingSuggest=false;
  if(chatTimer){ clearInterval(chatTimer); chatTimer=null; }
  const st=await api("/me/ai-auto-reply"); // 读取当前用户自动回复开关
  const chk=$("#aiAutoChk");
  if(chk && st.r.ok && st.j.data) chk.checked=!!st.j.data.ai_auto_reply;
  await loadChat();
  chatTimer=setInterval(loadChat, 2500); // 轮询拉取新消息(后端 requireAuth 仅认 Header, 故用轮询而非 SSE)
}

function renderMsg(m){
  if(m.from_id==="system") return `<div class="bubble sys">${esc(m.body)}</div>`;
  const mine=(m.from_id===ME.uid);
  const cls=mine?"me":(m.is_ai?"ai":"peer");
  let badge="";
  if(m.is_ai) badge=`<span class="badge ai-badge">🤖 AI 自动回复</span>`;
  else if(m.ai_type==="suggest") badge=`<span class="badge suggest-badge">AI 辅助</span>`;
  return `<div class="bubble ${cls}">${badge}${esc(m.body)}<span class="meta">${fmtTime(m.created_at)}</span></div>`;
}

async function loadChat(){
  if(!chatPeer) return;
  const {r,j}=await api("/im/conversations/"+encodeURIComponent(chatPeer));
  const box=$("#chatMsgs"); if(!box) return;
  const msgs=(r.ok&&j.data)?j.data:[];
  if(!msgs.length){ box.innerHTML=`<div class="muted tiny">暂无消息，开始沟通吧</div>`; return; }
  box.innerHTML=msgs.map(renderMsg).join("");
  box.scrollTop=box.scrollHeight;
}

async function sendChat(){
  const input=$("#chatInput"); if(!input) return;
  const body=input.value.trim(); if(!body) return;
  const {r,j}=await api("/im",{method:"POST",body:{to:chatPeer, body, ai_type: pendingSuggest?"suggest":""}});
  if(!r.ok){ toast((j&&j.msg)||"发送失败"); return; }
  input.value=""; pendingSuggest=false;
  const hint=$("#chatHint"); if(hint) hint.textContent="";
  await loadChat();
}

async function aiSuggest(){
  if(!chatPeer) return;
  const hint=$("#chatHint");
  const input=$("#chatInput");
  const text=input?input.value.trim():""; // 已有草稿则基于草稿; 否则后端回退取对方最近消息
  const {r,j}=await api("/im/"+encodeURIComponent(chatPeer)+"/ai-reply",{method:"POST",body:{text}});
  if(!r.ok){ toast((j&&j.msg)||"AI 建议失败"); return; }
  const rep=j.data||{};
  if(!rep.matched || !rep.text){
    if(hint) hint.textContent="AI 暂无合适建议，请自行回复或等待对方";
    toast("AI 暂无合适建议");
    return;
  }
  if(input){ input.value=rep.text; input.focus(); }
  pendingSuggest=true;
  if(hint) hint.textContent="🤖 AI 建议已填入：点「发送」将以「AI 辅助」标识发出（你可继续编辑）";
}

function bindChatEvents(){
  const send=$("#chatSendBtn"); if(send) send.onclick=sendChat;
  const sug=$("#aiSuggestBtn"); if(sug) sug.onclick=aiSuggest;
  const input=$("#chatInput");
  if(input) input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
  const chk=$("#aiAutoChk");
  if(chk) chk.onchange=async()=>{
    const {r,j}=await api("/me/ai-auto-reply",{method:"POST",body:{on:chk.checked}});
    toast((r.ok&&j.msg)||(j&&j.msg)||"设置失败");
    if(!r.ok) chk.checked=!chk.checked; // 失败回滚
  };
}
</script>
